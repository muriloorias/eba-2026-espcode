[platformio]
default_envs = esp32doit-devkit-v1

; configuracao comum aos dois ambientes
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit MPU6050 @ ^2.2.6
    madhephaestus/ESP32Servo @ ^3.0.6
    bblanchon/ArduinoJson @ ^7.0.0

; uso real: grava no ESP32 e conecta na rede definida em src/main.cpp
[env:esp32doit-devkit-v1]
build_src_filter = +<*> -<main_wokwi.cpp>

; teste no simulador Wokwi: compila so o src/main_wokwi.cpp (rede Wokwi-GUEST, sem rede.h)
; compile com: pio run -e wokwi
[env:wokwi]
build_flags = -DWOKWI
build_src_filter = +<*> -<main.cpp>
